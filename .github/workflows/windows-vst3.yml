name: Windows x64 package

on:
  push:
    paths:
      - "native/**"
      - "vendor/fmslogo-upstream/**"
      - ".github/workflows/windows-vst3.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Get Steinberg VST3 SDK
        shell: pwsh
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules `
            --branch v3.8.1_build_84 `
            https://github.com/steinbergmedia/vst3sdk.git `
            "$env:RUNNER_TEMP\vst3sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows x64 build
        shell: pwsh
        run: |
          cmake -S native -B "$env:RUNNER_TEMP\logo-vst3-build" `
            -G "Visual Studio 17 2022" -A x64 `
            -DLOGO_MIDI_BUILD_TESTS=ON `
            -DLOGO_MIDI_BUILD_VST3=ON `
            "-DVST3_SDK_ROOT=$env:RUNNER_TEMP\vst3sdk" `
            -DSMTG_RUN_VST_VALIDATOR=ON `
            -DSMTG_CREATE_PLUGIN_LINK=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build CLI and validate plugin
        shell: pwsh
        run: |
          cmake --build "$env:RUNNER_TEMP\logo-vst3-build" `
            --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native tests
        shell: pwsh
        run: |
          ctest --test-dir "$env:RUNNER_TEMP\logo-vst3-build" `
            -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check vendor and package Windows apps
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP `
            "logo-vst3-build\VST3\Release\logo-midi-vst3.vst3"
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) {
            throw "The Windows VST3 bundle was not created at $bundle"
          }

          $moduleInfo = Join-Path $bundle "Contents\Resources\moduleinfo.json"
          if (-not (Test-Path -LiteralPath $moduleInfo -PathType Leaf)) {
            throw "The VST3 bundle is missing moduleinfo.json"
          }
          $metadata = Get-Content -LiteralPath $moduleInfo -Raw
          if ($metadata -notmatch '"Vendor"\s*:\s*"Dexter U\.S\."') {
            throw "The VST3 bundle does not identify Dexter U.S. as vendor"
          }

          $stage = Join-Path $env:RUNNER_TEMP "logo-midi-package"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $bundle -Destination $stage -Recurse
          $cli = Join-Path $env:RUNNER_TEMP `
            "logo-vst3-build\Release\logo-midi.exe"
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) {
            throw "The Windows command-line executable was not created at $cli"
          }
          Copy-Item -LiteralPath $cli -Destination $stage
          $examples = Join-Path $stage "examples"
          New-Item -ItemType Directory -Path $examples -Force | Out-Null
          Copy-Item -Path "native\examples\*" -Destination $examples -Recurse
          Copy-Item -LiteralPath "vendor\fmslogo-upstream\LICENSE.TXT" `
            -Destination (Join-Path $stage "LICENSE-FMSLOGO.TXT")
          @'
          Logo MIDI Windows x64 package

          Contents:
            logo-midi.exe             Command-line app
            logo-midi-vst3.vst3       VST3 plugin bundle
            examples\                 Portable Logo scripts

          Render a drawing:
            logo-midi.exe --graphics examples\turtle-square.lgo --output square.svg

          Render MIDI:
            logo-midi.exe examples\scale.lgo --output scale.mid

          Copy logo-midi-vst3.vst3 to your VST3 plug-in folder to use it in a DAW.
          Keep examples\ beside the extracted files for convenient script access.
          Source and license: https://github.com/Dexter-us/logovst
          '@ | Set-Content -LiteralPath (Join-Path $stage "README.txt")

          $zip = Join-Path $env:RUNNER_TEMP "logo-midi-windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage "*") `
            -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "The combined Windows archive was not created"
          }

      - name: Upload combined Windows package
        uses: actions/upload-artifact@v4
        with:
          name: logo-midi-windows-x64
          path: ${{ runner.temp }}/logo-midi-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
